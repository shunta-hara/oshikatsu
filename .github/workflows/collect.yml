name: Collect

on:
  schedule:
    # 2時間ごとに実行（UTC 0:00 / 2:00 / ... / 22:00）。推し10人で1回約2分、月約720分の見込み（無料枠 2,000分）
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      oshi_id:
        description: '特定の推しのみ収集する場合に推し ID（数字）を指定する。空の場合は全推し対象。'
        required: false
        default: ''

# 全体収集（oshi_id なし）は同時実行しない。
# 特定推しの収集は同じ推し ID どうしのみ同時実行しない（異なる推しは独立して動く）。
concurrency:
  group: ${{ inputs.oshi_id != '' && format('collect-oshi-{0}', inputs.oshi_id) || 'collect-all' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: collector

      - name: Run collector
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          COLLECTOR_API_KEY: ${{ secrets.COLLECTOR_API_KEY }}
          OSHI_ID: ${{ inputs.oshi_id }}
        run: python -m collector
        working-directory: collector
