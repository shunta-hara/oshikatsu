name: Collect

on:
  schedule:
    # 2時間ごとに実行（UTC 0:17 / 2:17 / ... / 22:17）。推し10人で1回約2分、月約720分の見込み（無料枠 2,000分）
    # 正時（0分）は GitHub の定期実行が混み合い、遅延や取りやめが起きやすいので分をずらしている
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      talent_id:
        description: '特定のタレントのみ収集する場合にタレント ID（数字）を指定する。空の場合は全タレント対象。'
        required: false
        default: ''

# 全体収集（talent_id なし）は同時実行しない。
# 特定タレントの収集は同じタレント ID どうしのみ同時実行しない（異なるタレントは独立して動く）。
concurrency:
  group: ${{ inputs.talent_id != '' && format('collect-talent-{0}', inputs.talent_id) || 'collect-all' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: collector

      - name: Run collector
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          COLLECTOR_API_KEY: ${{ secrets.COLLECTOR_API_KEY }}
          TALENT_ID: ${{ inputs.talent_id }}
          # 未登録（空）の場合、collector は YouTube / X の収集をスキップする
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_RSS_BASE_URL: ${{ secrets.X_RSS_BASE_URL }}
        run: python -m collector
        working-directory: collector
