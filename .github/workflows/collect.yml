name: Collect

on:
  schedule:
    # 6時間ごとに実行（UTC 0:00 / 6:00 / 12:00 / 18:00）
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: collector

      - name: Run collector
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          COLLECTOR_API_KEY: ${{ secrets.COLLECTOR_API_KEY }}
        run: python -m collector
        working-directory: collector
