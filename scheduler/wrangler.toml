name = "oshikatsu-scheduler"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Cron Triggers 専用で HTTP の入口は使わないため、workers.dev の公開 URL を無効にする
workers_dev = false
preview_urls = false

[triggers]
# "17 */2 * * *"  ... 2時間ごとに GitHub workflow_dispatch でコレクターを起動
# "0 0 * * 1"     ... 毎週月曜 0:00 UTC に backend の期限切れ記事削除エンドポイントを呼ぶ
# "47 */2 * * *"  ... 2時間ごと（コレクター起動の30分後）に Web Push 通知ジョブを呼ぶ
crons = ["17 */2 * * *", "0 0 * * 1", "47 */2 * * *"]

[vars]
GITHUB_REPOSITORY = "shunta-hara/oshikatsu"
GITHUB_WORKFLOW_FILE = "collect.yml"
GITHUB_REF = "master"
BACKEND_API_URL = "https://oshikatsu-api.onrender.com"
