services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oshikatsu
      POSTGRES_PASSWORD: oshikatsu_dev
      POSTGRES_DB: oshikatsu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oshikatsu"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
